spring.application.name=complaintService
server.port=8082
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/complaintdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:9000/eureka}
eureka.instance.preferIpAddress=true

feign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.assignmentService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.assignmentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.assignmentService.waitDurationInOpenState=10s
internal.service.token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
