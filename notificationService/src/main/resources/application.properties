spring.application.name=notificationService
server.port=8084
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/notificationdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:9000/eureka}
eureka.instance.preferIpAddress=true
internal.service.token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
