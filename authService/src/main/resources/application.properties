spring.application.name=authService
server.port=8081
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/authdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:9000/eureka}
eureka.instance.preferIpAddress=true

jwt.secret=${JWT_SECRET}
jwt.accessTokenExpiryMs=86400000
jwt.refreshTokenExpiryMs=604800000
internal.service.token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
seed.user.password=${SEED_USER_PASSWORD:password}
